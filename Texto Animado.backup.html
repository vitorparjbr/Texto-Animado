<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextFlow - Animador de Texto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700;900&family=Roboto+Mono:wght@400;700&family=Bebas+Neue&family=Pacifico&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --bg-secondary: #12121a;
            --fg: #f0f0f5;
            --muted: #6b6b7a;
            --accent: #ff6b4a;
            --accent-glow: rgba(255, 107, 74, 0.3);
            --card: #1a1a24;
            --border: #2a2a38;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--fg);
            overflow-x: hidden;
        }

        .bg-pattern {
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 107, 74, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(100, 120, 255, 0.06) 0%, transparent 50%);
        }

        .glass-panel {
            background: rgba(18, 18, 26, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 4px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .btn-control {
            transition: all 0.2s ease;
        }

        .btn-control:hover {
            transform: translateY(-1px);
        }

        .btn-control:active {
            transform: translateY(0);
        }

        .input-field {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--fg);
            transition: border-color 0.2s;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent);
        }

        .select-field {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--fg);
        }

        .toggle-btn {
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: white;
        }

        .format-btn.active {
            border-color: var(--accent);
            background: rgba(255, 107, 74, 0.15);
        }

        .canvas-container {
            background: 
                linear-gradient(45deg, #1a1a24 25%, transparent 25%),
                linear-gradient(-45deg, #1a1a24 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #1a1a24 75%),
                linear-gradient(-45deg, transparent 75%, #1a1a24 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #12121a;
        }

        .menu-enter {
            animation: slideIn 0.3s ease forwards;
        }

        .menu-exit {
            animation: slideOut 0.3s ease forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(-100%); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .recording-indicator {
            animation: pulse 1s infinite;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        input[type="range"] {
            -webkit-appearance: none;
            background: var(--border);
            border-radius: 4px;
            height: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            overflow: hidden;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body class="min-h-screen bg-pattern">
    <button id="menuToggle" class="fixed top-4 left-4 z-50 glass-panel p-3 rounded-xl btn-control hover:border-[var(--accent)]" aria-label="Abrir menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <aside id="sideMenu" class="fixed left-0 top-0 h-full w-80 glass-panel z-40 overflow-hidden hidden">
        <div class="h-full flex flex-col">
            <div class="p-4 border-b border-[var(--border)] flex items-center justify-between">
                <h2 class="text-lg font-semibold">Configurações</h2>
                <button id="closeMenu" class="p-2 hover:bg-[var(--card)] rounded-lg transition-colors" aria-label="Fechar menu">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto scrollbar-thin p-4 space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-[var(--muted)]">Texto</label>
                    <textarea id="textInput" class="input-field w-full h-24 p-3 rounded-lg resize-none text-sm" placeholder="Digite seu texto aqui...">Texto animado surgindo do rodapé</textarea>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-[var(--muted)]">Velocidade</label>
                    <div class="flex items-center gap-3">
                        <input type="range" id="speedControl" min="0.5" max="5" step="0.1" value="2" class="flex-1">
                        <span id="speedValue" class="text-sm w-8">2x</span>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-[var(--muted)]">Alinhamento</label>
                    <div class="flex gap-2">
                        <button class="toggle-btn flex-1 p-2 rounded-lg border border-[var(--border)] active" data-align="left" aria-label="Alinhar esquerda">
                            <svg class="mx-auto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <line x1="3" y1="12" x2="15" y2="12"></line>
                                <line x1="3" y1="18" x2="18" y2="18"></line>
                            </svg>
                        </button>
                        <button class="toggle-btn flex-1 p-2 rounded-lg border border-[var(--border)]" data-align="center" aria-label="Centralizar">
                            <svg class="mx-auto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <line x1="6" y1="12" x2="18" y2="12"></line>
                                <line x1="4" y1="18" x2="20" y2="18"></line>
                            </svg>
                        </button>
                        <button class="toggle-btn flex-1 p-2 rounded-lg border border-[var(--border)]" data-align="right" aria-label="Alinhar direita">
                            <svg class="mx-auto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="3" y1="6" x2="21" y2="6"></line>
                                <line x1="9" y1="12" x2="21" y2="12"></line>
                                <line x1="6" y1="18" x2="21" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="text-sm font-medium text-[var(--muted)]">Fonte</label>
                    <select id="fontFamily" class="select-field w-full p-2 rounded-lg">
                        <option value="Space Grotesk">Space Grotesk</option>
                        <option value="Playfair Display">Playfair Display</option>
                        <option value="Roboto Mono">Roboto Mono</option>
                        <option value="Bebas Neue">Bebas Neue</option>
                        <option value="Pacifico">Pacifico</option>
                        <option value="Oswald">Oswald</option>
                    </select>
                    
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label class="text-xs text-[var(--muted)]">Tamanho</label>
                            <input type="number" id="fontSize" value="48" min="12" max="200" class="input-field w-full p-2 rounded-lg text-sm">
                        </div>
                        <div class="flex-1">
                            <label class="text-xs text-[var(--muted)]">Cor</label>
                            <div class="flex items-center gap-2 mt-1">
                                <input type="color" id="textColor" value="#ffffff">
                                <span id="colorHex" class="text-xs text-[var(--muted)]">#ffffff</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <button id="boldToggle" class="toggle-btn flex-1 p-2 rounded-lg border border-[var(--border)] font-bold" aria-label="Negrito">N</button>
                        <button id="italicToggle" class="toggle-btn flex-1 p-2 rounded-lg border border-[var(--border)] italic" aria-label="Itálico">I</button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="text-sm font-medium text-[var(--muted)]">Efeitos</label>
                    <select id="effectType" class="select-field w-full p-2 rounded-lg">
                        <option value="none">Nenhum</option>
                        <option value="shadow">Sombra</option>
                        <option value="neon">Neon</option>
                        <option value="outline">Contorno</option>
                        <option value="hollow">Vazado</option>
                        <option value="glow">Brilho</option>
                    </select>

                    <div id="effectOptions" class="space-y-3 hidden">
                        <div class="flex items-center gap-3">
                            <label class="text-xs text-[var(--muted)] w-16">Cor</label>
                            <input type="color" id="effectColor" value="#ff6b4a">
                        </div>
                        <div class="flex items-center gap-3">
                            <label class="text-xs text-[var(--muted)] w-16">Espessura</label>
                            <input type="range" id="effectThickness" min="1" max="20" value="3" class="flex-1">
                            <span id="thicknessValue" class="text-xs w-6">3</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <label class="text-xs text-[var(--muted)] w-16">Intensidade</label>
                            <input type="range" id="effectIntensity" min="0" max="100" value="50" class="flex-1">
                            <span id="intensityValue" class="text-xs w-8">50%</span>
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-[var(--muted)]">Formato</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="format-btn p-3 rounded-lg border border-[var(--border)] text-center text-xs" data-format="9:16">
                            <div class="w-4 h-7 bg-[var(--muted)] mx-auto mb-1 rounded-sm"></div>
                            9:16
                        </button>
                        <button class="format-btn p-3 rounded-lg border border-[var(--border)] text-center text-xs active" data-format="1:1">
                            <div class="w-5 h-5 bg-[var(--muted)] mx-auto mb-1 rounded-sm"></div>
                            1:1
                        </button>
                        <button class="format-btn p-3 rounded-lg border border-[var(--border)] text-center text-xs" data-format="16:9">
                            <div class="w-7 h-4 bg-[var(--muted)] mx-auto mb-1 rounded-sm"></div>
                            16:9
                        </button>
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="text-sm font-medium text-[var(--muted)]">Fundo</label>
                    <div class="flex gap-2">
                        <button id="bgTransparent" class="toggle-btn flex-1 p-2 rounded-lg border border-[var(--border)] text-xs active">Transparente</button>
                        <button id="bgColor" class="toggle-btn flex-1 p-2 rounded-lg border border-[var(--border)] text-xs">Cor</button>
                    </div>
                    <div id="bgColorPicker" class="hidden">
                        <input type="color" id="bgColorValue" value="#0a0a0f">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs text-[var(--muted)]">Importar imagem/vídeo</label>
                        <input type="file" id="mediaInput" accept="image/*,video/*" class="input-field w-full p-2 rounded-lg text-xs">
                    </div>
                    <button id="removeMedia" class="w-full p-2 rounded-lg border border-[var(--border)] text-xs hover:border-red-500 hover:text-red-400 transition-colors hidden">Remover fundo importado</button>
                </div>
            </div>

            <div class="p-4 border-t border-[var(--border)] space-y-3">
                <button id="exportBtn" class="w-full py-3 px-4 bg-[var(--accent)] rounded-xl font-medium btn-control flex items-center justify-center gap-2">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7,10 12,15 17,10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Exportar Vídeo
                </button>
                <div id="progressContainer" class="w-full h-1.5 bg-[var(--border)] rounded-full overflow-hidden hidden">
                    <div id="progressBar" class="h-full bg-[var(--accent)] w-0" style="transition: width 0.1s linear;"></div>
                </div>
                <p id="exportStatus" class="text-xs text-center text-[var(--muted)] hidden"></p>
            </div>
        </div>
    </aside>

    <main class="min-h-screen flex items-center justify-center p-4 md:p-8">
        <div class="relative">
            <div id="canvasContainer" class="canvas-container rounded-2xl overflow-hidden shadow-2xl relative">
                <canvas id="mainCanvas" width="720" height="720"></canvas>
                
                <video id="videoBg" class="absolute inset-0 w-full h-full object-cover hidden" muted loop playsinline></video>
                
                <img id="imageBg" class="absolute inset-0 w-full h-full object-cover hidden" alt="">
            </div>

            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-3 glass-panel rounded-full px-4 py-2">
                <button id="playPauseBtn" class="p-2 hover:bg-[var(--card)] rounded-full transition-colors" aria-label="Play/Pause">
                    <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5,3 19,12 5,21"></polygon>
                    </svg>
                    <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="hidden">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                </button>
                <button id="resetBtn" class="p-2 hover:bg-[var(--card)] rounded-full transition-colors" aria-label="Reiniciar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </button>
                <span id="recordingBadge" class="hidden px-2 py-1 bg-red-500 text-white text-xs rounded-full recording-indicator">REC</span>
            </div>
        </div>
    </main>

    <script>
        // State
        const state = {
            text: 'Texto animado surgindo do rodapé',
            speed: 2,
            align: 'left',
            fontFamily: 'Space Grotesk',
            fontSize: 48,
            textColor: '#ffffff',
            bold: false,
            italic: false,
            effect: 'none',
            effectColor: '#ff6b4a',
            effectThickness: 3,
            effectIntensity: 50,
            format: '1:1',
            bgTransparent: true,
            bgColor: '#0a0a0f',
            mediaType: null,
            mediaSource: null,
            isPlaying: true,
            animationY: 0,
            lastTime: 0,
            animationId: null
        };

        // DOM Elements
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const videoBg = document.getElementById('videoBg');
        const imageBg = document.getElementById('imageBg');
        const canvasContainer = document.getElementById('canvasContainer');

        // Format dimensions
        const formats = {
            '9:16': { width: 405, height: 720 },
            '1:1': { width: 720, height: 720 },
            '16:9': { width: 720, height: 405 }
        };

        // Initialize canvas
        function initCanvas() {
            const format = formats[state.format];
            canvas.width = format.width;
            canvas.height = format.height;
            canvas.style.width = `${Math.min(format.width, window.innerWidth - 32)}px`;
            canvas.style.height = `${Math.min(format.height, window.innerHeight - 150)}px`;
            
            // Maintain aspect ratio
            const maxWidth = Math.min(format.width, window.innerWidth - 32);
            const scale = maxWidth / format.width;
            canvas.style.width = `${maxWidth}px`;
            canvas.style.height = `${format.height * scale}px`;
            
            state.animationY = canvas.height + 50;
        }

        // Animation loop
        function animate(timestamp) {
            if (!state.lastTime) state.lastTime = timestamp;
            const delta = (timestamp - state.lastTime) / 1000;
            state.lastTime = timestamp;

            if (state.isPlaying) {
                state.animationY -= state.speed * 60 * delta;
                
                // Reset when text goes off screen
                if (state.animationY < -getTextHeight() - 50) {
                    state.animationY = canvas.height + 50;
                }
            }

            render();
            state.animationId = requestAnimationFrame(animate);
        }

        // Get text height
        function getTextHeight() {
            ctx.font = getFont();
            const lines = wrapText(state.text, canvas.width - 40);
            const lineHeight = state.fontSize * 1.3;
            return lines.length * lineHeight;
        }

        // Get font string
        function getFont() {
            const weight = state.bold ? 'bold' : 'normal';
            const style = state.italic ? 'italic' : 'normal';
            return `${style} ${weight} ${state.fontSize}px "${state.fontFamily}"`;
        }

        // Wrap text
        function wrapText(text, maxWidth) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';

            ctx.font = getFont();

            for (const word of words) {
                const testLine = currentLine + (currentLine ? ' ' : '') + word;
                const metrics = ctx.measureText(testLine);

                if (metrics.width > maxWidth && currentLine) {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            }

            if (currentLine) {
                lines.push(currentLine);
            }

            return lines.length ? lines : [''];
        }

        // Render
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw background with safety check (Correção 2 aplicada aqui)
            try {
                if (state.mediaType === 'video' && videoBg.src && videoBg.readyState >= 2) {
                    ctx.drawImage(videoBg, 0, 0, canvas.width, canvas.height);
                } else if (state.mediaType === 'image' && imageBg.src && imageBg.complete) {
                    ctx.drawImage(imageBg, 0, 0, canvas.width, canvas.height);
                } else if (!state.bgTransparent) {
                    ctx.fillStyle = state.bgColor;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            } catch (error) {
                console.warn("Aguardando carregamento da mídia...");
            }

            // Draw text
            const lines = wrapText(state.text, canvas.width - 40);
            const lineHeight = state.fontSize * 1.3;
            const totalHeight = lines.length * lineHeight;

            ctx.font = getFont();
            ctx.textBaseline = 'top';

            // Calculate x position based on alignment
            let textAlign = 'left';
            if (state.align === 'center') textAlign = 'center';
            if (state.align === 'right') textAlign = 'right';
            ctx.textAlign = textAlign;

            let startX = 20;
            if (state.align === 'center') startX = canvas.width / 2;
            if (state.align === 'right') startX = canvas.width - 20;

            // Draw each line with effects
            lines.forEach((line, i) => {
                const y = state.animationY + i * lineHeight;

                // Skip if outside canvas
                if (y < -lineHeight || y > canvas.height + lineHeight) return;

                // Apply effects
                applyEffect(line, startX, y);
            });
        }

        // Apply text effect
        function applyEffect(text, x, y) {
            ctx.save();

            const color = state.textColor;
            const effectColor = state.effectColor;
            const thickness = Math.max(1, state.effectThickness);
            const intensity = state.effectIntensity / 100;

            switch (state.effect) {
                case 'shadow':
                    ctx.shadowColor = effectColor;
                    ctx.shadowBlur = thickness * 3;
                    ctx.shadowOffsetX = thickness;
                    ctx.shadowOffsetY = thickness;
                    ctx.fillStyle = color;
                    ctx.fillText(text, x, y);
                    break;

                case 'neon':
                    ctx.shadowColor = effectColor;
                    ctx.shadowBlur = thickness * 5 * intensity;
                    ctx.fillStyle = color;
                    for (let i = 0; i < 3; i++) {
                        ctx.fillText(text, x, y);
                    }
                    break;

                case 'outline':
                    ctx.strokeStyle = effectColor;
                    ctx.lineWidth = thickness;
                    ctx.fillStyle = color;
                    ctx.strokeText(text, x, y);
                    ctx.fillText(text, x, y);
                    break;

                case 'hollow':
                    ctx.strokeStyle = effectColor;
                    ctx.lineWidth = thickness;
                    ctx.strokeText(text, x, y);
                    break;

                case 'glow':
                    ctx.shadowColor = effectColor;
                    ctx.shadowBlur = thickness * 8;
                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.3 + (0.7 * intensity);
                    ctx.fillText(text, x, y);
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                    ctx.fillText(text, x, y);
                    break;

                default:
                    ctx.fillStyle = color;
                    ctx.fillText(text, x, y);
            }

            ctx.restore();
        }

        // Event Handlers
        document.getElementById('menuToggle').addEventListener('click', () => {
            const menu = document.getElementById('sideMenu');
            menu.classList.remove('hidden');
            menu.classList.remove('menu-exit');
            menu.classList.add('menu-enter');
        });

        document.getElementById('closeMenu').addEventListener('click', () => {
            const menu = document.getElementById('sideMenu');
            menu.classList.remove('menu-enter');
            menu.classList.add('menu-exit');
            setTimeout(() => menu.classList.add('hidden'), 300);
        });

        document.getElementById('textInput').addEventListener('input', (e) => {
            state.text = e.target.value || '';
        });

        document.getElementById('speedControl').addEventListener('input', (e) => {
            state.speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = `${state.speed}x`;
        });

        // Alignment buttons
        document.querySelectorAll('[data-align]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-align]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.align = btn.dataset.align;
            });
        });

        document.getElementById('fontFamily').addEventListener('change', (e) => {
            state.fontFamily = e.target.value;
        });

        document.getElementById('fontSize').addEventListener('input', (e) => {
            state.fontSize = Math.max(12, Math.min(200, parseInt(e.target.value) || 48));
        });

        document.getElementById('textColor').addEventListener('input', (e) => {
            state.textColor = e.target.value;
            document.getElementById('colorHex').textContent = e.target.value;
        });

        document.getElementById('boldToggle').addEventListener('click', (e) => {
            state.bold = !state.bold;
            e.target.classList.toggle('active');
        });

        document.getElementById('italicToggle').addEventListener('click', (e) => {
            state.italic = !state.italic;
            e.target.classList.toggle('active');
        });

        document.getElementById('effectType').addEventListener('change', (e) => {
            state.effect = e.target.value;
            document.getElementById('effectOptions').classList.toggle('hidden', e.target.value === 'none');
        });

        document.getElementById('effectColor').addEventListener('input', (e) => {
            state.effectColor = e.target.value;
        });

        document.getElementById('effectThickness').addEventListener('input', (e) => {
            state.effectThickness = parseInt(e.target.value);
            document.getElementById('thicknessValue').textContent = e.target.value;
        });

        document.getElementById('effectIntensity').addEventListener('input', (e) => {
            state.effectIntensity = parseInt(e.target.value);
            document.getElementById('intensityValue').textContent = `${e.target.value}%`;
        });

        // Format buttons
        document.querySelectorAll('[data-format]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-format]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.format = btn.dataset.format;
                initCanvas();
                state.animationY = canvas.height + 50;
            });
        });

        // Background controls
        document.getElementById('bgTransparent').addEventListener('click', (e) => {
            state.bgTransparent = true;
            document.getElementById('bgTransparent').classList.add('active');
            document.getElementById('bgColor').classList.remove('active');
            document.getElementById('bgColorPicker').classList.add('hidden');
        });

        document.getElementById('bgColor').addEventListener('click', (e) => {
            state.bgTransparent = false;
            document.getElementById('bgColor').classList.add('active');
            document.getElementById('bgTransparent').classList.remove('active');
            document.getElementById('bgColorPicker').classList.remove('hidden');
        });

        document.getElementById('bgColorValue').addEventListener('input', (e) => {
            state.bgColor = e.target.value;
        });

        // Media input (Correção 1 aplicada aqui: não alteramos o 'hidden' do vídeo/imagem)
        document.getElementById('mediaInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);

            if (file.type.startsWith('video/')) {
                state.mediaType = 'video';
                state.mediaSource = url;
                videoBg.src = url;
                videoBg.play();
            } else if (file.type.startsWith('image/')) {
                state.mediaType = 'image';
                state.mediaSource = url;
                imageBg.src = url;
            }

            document.getElementById('removeMedia').classList.remove('hidden');
        });

        document.getElementById('removeMedia').addEventListener('click', () => {
            state.mediaType = null;
            state.mediaSource = null;
            videoBg.src = '';
            imageBg.src = '';
            document.getElementById('removeMedia').classList.add('hidden');
            document.getElementById('mediaInput').value = '';
        });

        // Play/Pause
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            state.isPlaying = !state.isPlaying;
            document.getElementById('playIcon').classList.toggle('hidden', state.isPlaying);
            document.getElementById('pauseIcon').classList.toggle('hidden', !state.isPlaying);
            
            if (state.mediaType === 'video') {
                if (state.isPlaying) {
                    videoBg.play();
                } else {
                    videoBg.pause();
                }
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            state.animationY = canvas.height + 50;
        });

        // Export
        document.getElementById('exportBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('exportStatus');
            const exportBtn = document.getElementById('exportBtn');
            const recordingBadge = document.getElementById('recordingBadge');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            statusEl.classList.remove('hidden');
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            statusEl.textContent = 'Calculando tempo do vídeo...';
            exportBtn.disabled = true;
            recordingBadge.classList.remove('hidden');

            try {
                const stream = canvas.captureStream(30);
                const mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm;codecs=vp9',
                    videoBitsPerSecond: 5000000
                });

                const chunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) chunks.push(e.data);
                };

                // --- NOVO CÁLCULO DE DURAÇÃO DINÂMICA ---
                const textHeight = getTextHeight();
                // Distância total: Altura da tela + altura do texto + 100px de margem de segurança
                const totalDistance = canvas.height + textHeight + 100; 
                // Velocidade baseada na mesma matemática do requestAnimationFrame (speed * 60)
                const pixelsPerSecond = state.speed * 60; 
                const duration = (totalDistance / pixelsPerSecond) * 1000;
                // ----------------------------------------

                const startY = state.animationY;

                mediaRecorder.start();
                statusEl.textContent = `Gravando (~${Math.ceil(duration/1000)}s)...`;

                // Reseta a posição do texto e garante que está tocando
                state.animationY = canvas.height + 50;
                state.isPlaying = true;

                // --- ANIMAÇÃO DA BARRA DE PROGRESSO ---
                const startTime = Date.now();
                const progressInterval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min((elapsed / duration) * 100, 100);
                    progressBar.style.width = `${progress}%`;
                }, 100);

                // Aguarda o tempo exato da animação completar
                await new Promise(resolve => {
                    setTimeout(() => {
                        clearInterval(progressInterval);
                        mediaRecorder.stop();
                        resolve();
                    }, duration);
                });

                statusEl.textContent = 'Processando vídeo...';
                progressBar.style.width = '100%';

                // Cria o arquivo final assim que o MediaRecorder parar de fato
                const blob = await new Promise(resolve => {
                    mediaRecorder.onstop = () => {
                        resolve(new Blob(chunks, { type: 'video/webm' }));
                    };
                });

                // Faz o download
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'texto-animado.webm';
                a.click();
                URL.revokeObjectURL(url);

                // Volta o estado original
                state.animationY = startY;
                statusEl.textContent = 'Exportado com sucesso!';
                
                // Esconde a barra de progresso após 3 segundos
                setTimeout(() => {
                    statusEl.classList.add('hidden');
                    progressContainer.classList.add('hidden');
                    progressBar.style.width = '0%';
                }, 3000);

            } catch (error) {
                console.error('Export error:', error);
                statusEl.textContent = 'Erro na exportação. Tente novamente.';
                progressContainer.classList.add('hidden');
            }

            exportBtn.disabled = false;
            recordingBadge.classList.add('hidden');
        });

        // Responsive
        function handleResize() {
            const format = formats[state.format];
            const maxWidth = Math.min(format.width, window.innerWidth - 32);
            const scale = maxWidth / format.width;
            canvas.style.width = `${maxWidth}px`;
            canvas.style.height = `${format.height * scale}px`;
        }

        window.addEventListener('resize', handleResize);

        // Initialize
        initCanvas();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
